<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Esta etiqueta es CLAVE para el diseño adaptable en celulares -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rick and Morty | Personajes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="encabezado">
    <h1 class="titulo">Rick <span>and</span> Morty</h1>
    <p class="subtitulo">Explorador de personajes del multiverso</p>
  </header>

  <main class="contenedor">
    <!-- Pestañas para cambiar de sección -->
    <nav class="pestanas" role="tablist" aria-label="Secciones">
      <button class="pestana activa" type="button" role="tab" aria-selected="true" data-vista="personajes">🧪 Personajes</button>
      <button class="pestana" type="button" role="tab" aria-selected="false" data-vista="favoritos">⭐ Favoritos (<span id="contador-favoritos">0</span>)</button>
    </nav>

    <!-- ===== Vista 1: Personajes ===== -->
    <section id="vista-personajes" class="vista">
    <!-- Buscador y filtros -->
    <section class="controles">
      <input id="buscador" class="buscador" type="search"
             placeholder="Busca un personaje... (ej. Rick)" autocomplete="off">
      <div class="filtros">
        <select id="filtro-estado" class="filtro" aria-label="Filtrar por estado">
          <option value="">Todos los estados</option>
          <option value="alive">Vivos</option>
          <option value="dead">Muertos</option>
          <option value="unknown">Desconocido</option>
        </select>
        <select id="filtro-especie" class="filtro" aria-label="Filtrar por especie">
          <option value="">Todas las especies</option>
          <option value="human">Humano</option>
          <option value="alien">Alienígena</option>
          <option value="humanoid">Humanoide</option>
          <option value="robot">Robot</option>
          <option value="animal">Animal</option>
          <option value="mythological creature">Criatura mitológica</option>
        </select>
      </div>
    </section>

    <h2 class="seccion-titulo">Personajes</h2>

    <!-- Mensaje de estado: "Cargando...", errores, etc. -->
    <div id="estado" class="estado" role="status" aria-live="polite"></div>

    <!-- Aquí JavaScript insertará las tarjetas de los personajes -->
    <section id="lista-personajes" class="grid"></section>

    <button id="btn-mas" class="boton" hidden>Cargar más personajes</button>
    </section>

    <!-- ===== Vista 2: Favoritos ===== -->
    <section id="vista-favoritos" class="vista" hidden>
      <h2 class="seccion-titulo">⭐ Mis favoritos</h2>
      <p id="favoritos-vacio" class="ayuda">
        Todavía no tienes favoritos. Toca la estrella ☆ de cualquier personaje para guardarlo aquí.
      </p>
      <div id="lista-favoritos" class="grid"></div>
    </section>
  </main>

  <footer class="pie">
    Datos de <a href="https://rickandmortyapi.com" target="_blank" rel="noopener">The Rick and Morty API</a>
  </footer>

  <!-- El script va al final para que el HTML ya exista cuando se ejecute -->
  <script src="script.js"></script>
</body>
</html>
